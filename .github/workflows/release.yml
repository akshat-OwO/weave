name: Release CLI

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  release:
    name: Version or release CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create or update release pull request
        id: changesets
        uses: changesets/action@v1
        with:
          commit: "chore: release"
          title: "chore: release"
          version: bun run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this version is already released
        if: steps.changesets.outputs.hasChangesets == 'false'
        id: release
        shell: bash
        run: |
          version="$(jq --raw-output .version packages/cli/package.json)"
          tag="v${version}"

          if git rev-parse --verify --quiet "refs/tags/${tag}"; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Validate release
        if: steps.release.outputs.release == 'true'
        run: |
          bun run lint
          bunx turbo check-types
          bunx turbo test

      - name: Build release binaries
        if: steps.release.outputs.release == 'true'
        run: bun run --cwd packages/cli build

      - name: Generate checksums
        if: steps.release.outputs.release == 'true'
        shell: bash
        run: |
          assets=(
            packages/cli/out/weave-bun-darwin-arm64
            packages/cli/out/weave-bun-darwin-x64
            packages/cli/out/weave-bun-linux-arm64
            packages/cli/out/weave-bun-linux-x64
            packages/cli/out/weave-bun-windows-arm64.exe
            packages/cli/out/weave-bun-windows-x64.exe
          )
          sha256sum "${assets[@]}" > packages/cli/out/checksums.txt

      - name: Create tag and GitHub release
        if: steps.release.outputs.release == 'true'
        shell: bash
        run: |
          assets=(
            packages/cli/out/weave-bun-darwin-arm64
            packages/cli/out/weave-bun-darwin-x64
            packages/cli/out/weave-bun-linux-arm64
            packages/cli/out/weave-bun-linux-x64
            packages/cli/out/weave-bun-windows-arm64.exe
            packages/cli/out/weave-bun-windows-x64.exe
            packages/cli/out/checksums.txt
          )
          gh release create \
            "${{ steps.release.outputs.tag }}" \
            "${assets[@]}" \
            --generate-notes \
            --target "$GITHUB_SHA" \
            --title "Weave ${{ steps.release.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
