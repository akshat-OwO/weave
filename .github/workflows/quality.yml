name: Quality

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply Ultracite fixes
        run: bun run fix

      - name: Verify fixes are committed
        run: git diff --exit-code

      - name: Run Ultracite quality checks
        run: bun run lint

      - name: Check project types
        run: bunx turbo check-types

      - name: Run project tests
        run: bunx turbo test
